<aside class="reading-panel" id="reading-panel" aria-labelledby="leitura-title">
  <div class="reading-panel__head">
    <h2 id="leitura-title">Leitura do mapa</h2>
    <button type="button" class="icon-btn" id="btn-toggle-leitura" aria-label="Recolher Leitura do mapa">‹</button>
  </div>
  <section class="reading-seeing panel--active" aria-labelledby="seeing-title">
    <div class="panel__title-row">
      <h3 id="seeing-title">O que estou vendo?</h3>
      <span id="active-count" class="badge" aria-live="polite">0</span>
    </div>
    <div id="active-layers" class="active-layers">
      <p class="empty-hint">Nenhuma camada ativa</p>
    </div>
  </section>
  <button type="button" class="reading-panel__more" id="btn-ver-detalhes">Legendas</button>
</aside>
