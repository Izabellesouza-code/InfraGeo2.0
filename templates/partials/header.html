<header class="app-header" role="banner">
  <button
    type="button"
    class="app-header__menu"
    id="btn-toggle-sidebar"
    aria-label="Abrir menu de camadas"
    aria-expanded="false"
    aria-controls="sidebar-principal"
  >
    <span class="app-header__menu-bars" aria-hidden="true"></span>
  </button>

  <div class="app-header__brand">
    <div class="app-header__logos" aria-label="Parceiros">
      <img
        class="app-header__logo app-header__logo--spu"
        src="/static/img/logo-consorcio-spu.png?v=5"
        alt="Consórcio SPU — Assessoramento AM"
        width="160"
        height="64"
        decoding="async"
      />
      <img
        class="app-header__logo app-header__logo--dnit"
        src="/static/img/logo-dnit.png?v=5"
        alt="DNIT — Departamento Nacional de Infraestrutura de Transportes"
        width="180"
        height="56"
        decoding="async"
      />
    </div>
    <div class="app-header__titles">
      <strong>InfraGeo AM</strong>
      <span>Sistema de Informações Geográficas</span>
    </div>
  </div>

  <div class="app-header__actions">
    <button
      type="button"
      class="btn-link"
      id="btn-sobre"
      aria-haspopup="dialog"
      aria-controls="modal-sobre"
    >
      Sobre
    </button>
    <button
      type="button"
      class="btn-link"
      id="btn-exportar-mapa"
    >
      Exportar
    </button>
    <button
      type="button"
      class="btn-link"
      id="btn-filtros"
      aria-expanded="false"
      aria-controls="painel-filtros"
    >
      Filtros
    </button>
  </div>
</header>
