<main class="map-area" role="main">
  <div
    id="map"
    class="map-canvas"
    data-lat="{{ center_lat }}"
    data-lon="{{ center_lon }}"
    data-zoom="{{ zoom }}"
    aria-label="Mapa geográfico do Amazonas"
  ></div>

  <footer class="map-footer" role="contentinfo">
    <span class="map-footer__copy">
      © {{ year }} InfraGeo AM
    </span>
    <span class="map-footer__sep" aria-hidden="true">·</span>
    <button type="button" class="map-footer__link" id="btn-sobre-footer">
      Sobre
    </button>
  </footer>
</main>
