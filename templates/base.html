<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
  <meta name="theme-color" content="#f4f7fb" />
  <title>{% block title %}{{ app_name }}{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/css/variables.css?v=24" />
  <link rel="stylesheet" href="/static/css/select-combo.css?v=2" />
  <link rel="stylesheet" href="/static/css/base.css?v=19" />
  <link rel="stylesheet" href="/static/css/header.css?v=47" />
  <link rel="stylesheet" href="/static/css/sidebar.css?v=38" />
  <link rel="stylesheet" href="/static/css/map.css?v=27" />
  <link rel="stylesheet" href="/static/css/chrome.css?v=15" />
  <link rel="stylesheet" href="/static/css/components.css?v=23" />
  <link rel="stylesheet" href="/static/css/br-shield.css?v=14" />
  <link rel="stylesheet" href="/static/css/attr-table.css?v=28" />
  <link rel="stylesheet" href="/static/css/hover-popup.css?v=23" />
  <link rel="stylesheet" href="/static/css/login-modal.css?v=19" />
  <link rel="stylesheet" href="/static/css/print-map.css?v=29" />
  <link rel="stylesheet" href="/static/css/responsive.css?v=20" />
  <link rel="stylesheet" href="/static/css/boot-splash.css?v=1" />
  <link rel="stylesheet" href="/static/css/about.css?v=8" />
  <link rel="stylesheet" href="/static/css/layout-mode.css?v=31" />
  <link rel="stylesheet" href="/static/css/agent.css?v=15" />
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div id="boot-splash" class="boot-splash" role="status" aria-live="polite" aria-busy="true">
    <div class="boot-splash__inner">
      <img
        class="boot-splash__logo"
        src="/static/img/infrageo-splash.png"
        alt="InfraGEO — Meio Ambiente"
        width="960"
        height="360"
        decoding="async"
      />
      <p class="boot-splash__msg">Aguarde, estamos carregando as informações…</p>
      <div class="boot-splash__bar" aria-hidden="true">
        <span class="boot-splash__bar-fill"></span>
      </div>
    </div>
  </div>

  {% include "partials/header.html" %}

  <div class="app-layout">
    {% block sidebar %}{% endblock %}
    {% block content %}{% endblock %}
  </div>

  {% block panels %}{% endblock %}

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="/static/js/config/runtime.js?v=2"></script>
  <script src="/static/js/config/api.js?v=3"></script>
  <script src="/static/js/config/layers.config.js?v=31"></script>
  <script src="/static/js/modules/select-combo.js?v=1"></script>
  <script src="/static/js/modules/br-shield.js?v=15"></script>
  <script src="/static/js/modules/hover-popup.js?v=30"></script>
  <script src="/static/js/modules/auth.js?v=28"></script>
  <script src="/static/js/modules/about.js?v=6"></script>
  <script src="/static/js/core/map.js?v=40"></script>
  <script src="/static/js/modules/sidebar.js?v=26"></script>
  <script src="/static/js/modules/layers.js?v=44"></script>
  <script src="/static/js/modules/legend.js?v=23"></script>
  <script src="/static/js/modules/filters.js?v=23"></script>
  <script src="/static/js/modules/chrome.js?v=10"></script>
  <script src="/static/js/modules/attr-table.js?v=33"></script>
  <script src="/static/js/modules/print-map.js?v=63"></script>
  <script src="/static/js/modules/layout-mode.js?v=25"></script>
  <script src="/static/js/modules/agent.js?v=23"></script>
  <script src="/static/js/app.js?v=29"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
