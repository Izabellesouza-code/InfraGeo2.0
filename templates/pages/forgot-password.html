<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Esqueceu a senha — {{ app_name }}</title>
  {% include "partials/favicon.html" %}
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/login-page.css?v=22" />
</head>
<body class="login-page">
  <main class="login-page__card">
    <h1>InfraGeo AM</h1>
    <p>Informe o e-mail de administrador. Enviamos um código para redefinir a senha.</p>
    <form id="form-forgot-password" autocomplete="on">
      <label>
        E-mail cadastrado
        <input id="forgot-email" name="email" type="email" autocomplete="email" required />
      </label>
      <p id="login-page-erro" class="login-page__erro" hidden></p>
      <p id="login-page-ok" class="login-page__ok" hidden></p>
      <button type="submit" class="login-page__btn">Enviar código</button>
    </form>
    <p class="login-page__note">
      <a class="login-page__link" href="/login">Voltar ao login</a>
    </p>
  </main>
  <script src="/static/js/config/runtime.js?v=2"></script>
  <script src="/static/js/config/api.js?v=3"></script>
  <script src="/static/js/modules/login-page.js?v=14"></script>
</body>
</html>
