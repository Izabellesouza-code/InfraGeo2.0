<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Esqueceu a senha — {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/login-page.css?v=22" />
</head>
<body class="login-page">
  <main class="login-page__card">
    <h1>InfraGeo AM</h1>
    <p>Confirme o e-mail e o nome cadastrados para definir uma nova senha. Não precisa de Gmail.</p>
    <form id="form-recover-password" autocomplete="on">
      <label>
        E-mail cadastrado
        <input id="recover-email" name="email" type="email" autocomplete="email" required />
      </label>
      <label>
        Nome completo cadastrado
        <input id="recover-nome" name="nome" type="text" autocomplete="name" required />
      </label>
      <label>
        Nova senha
        <input id="recover-password" name="password" type="password" autocomplete="new-password" minlength="6" required />
      </label>
      <p id="login-page-erro" class="login-page__erro" hidden></p>
      <p id="login-page-ok" class="login-page__ok" hidden></p>
      <button type="submit" class="login-page__btn">Salvar nova senha</button>
    </form>
    <p class="login-page__note">
      <a class="login-page__link" href="/login">Voltar ao login</a>
    </p>
  </main>
  <script src="/static/js/config/runtime.js?v=2"></script>
  <script src="/static/js/config/api.js?v=2"></script>
  <script src="/static/js/modules/login-page.js?v=3"></script>
</body>
</html>
