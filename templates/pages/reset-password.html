<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nova senha — {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/login-page.css?v=22" />
</head>
<body class="login-page">
  <main class="login-page__card">
    <h1>InfraGeo AM</h1>
    <p>Digite o código de 6 números recebido no e-mail e a nova senha.</p>
    <form id="form-reset-password" autocomplete="on">
      <label>
        Código de 6 dígitos
        <input id="reset-token" name="token" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required />
      </label>
      <label>
        Nova senha
        <input id="reset-password" name="password" type="password" autocomplete="new-password" minlength="6" required />
      </label>
      <p id="login-page-erro" class="login-page__erro" hidden></p>
      <p id="login-page-ok" class="login-page__ok" hidden></p>
      <button type="submit" class="login-page__btn">Salvar senha</button>
    </form>
    <p class="login-page__note">
      <a class="login-page__link" href="/login">Voltar ao login</a>
    </p>
  </main>
  <script src="/static/js/config/runtime.js?v=2"></script>
  <script src="/static/js/config/api.js?v=3"></script>
  <script src="/static/js/modules/login-page.js?v=2"></script>
</body>
</html>
