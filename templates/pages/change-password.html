<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Definir senha — {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/login-page.css?v=22" />
</head>
<body class="login-page">
  <main class="login-page__card">
    <h1>InfraGeo AM</h1>
    <p>Este é o primeiro acesso. Crie uma senha nova para substituir a senha provisória.</p>
    <form id="form-change-password" autocomplete="on">
      <label>
        Senha provisória
        <input id="change-current" name="current_password" type="password" autocomplete="current-password" required />
      </label>
      <label>
        Nova senha
        <input id="change-new" name="new_password" type="password" autocomplete="new-password" minlength="6" required />
      </label>
      <label>
        Confirmar nova senha
        <input id="change-confirm" name="confirm_password" type="password" autocomplete="new-password" minlength="6" required />
      </label>
      <p id="login-page-erro" class="login-page__erro" hidden></p>
      <p id="login-page-ok" class="login-page__ok" hidden></p>
      <button type="submit" class="login-page__btn">Salvar senha</button>
    </form>
  </main>
  <script src="/static/js/config/runtime.js?v=2"></script>
  <script src="/static/js/config/api.js?v=3"></script>
  <script src="/static/js/modules/login-page.js?v=9"></script>
</body>
</html>
