# Render Blueprint — API InfraGeo 2.0 (runtime Python, mais estável no free)

services:
  - type: web
    name: infrageo-api
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_NAME
        value: InfraGeo AM
      - key: APP_VERSION
        value: 2.0.0
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app$"
      - key: AUTH_BOOTSTRAP_USERNAME
        value: admin
      - key: AUTH_BOOTSTRAP_PASSWORD
        sync: false
      - key: AUTH_BOOTSTRAP_EMAIL
        value: admin@infrageo.local
      - key: POSTGIS_SIMPLIFY_TOLERANCE
        value: "0.00035"
      - key: POSTGIS_GEOJSON_LIMIT
        value: "0"
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
      - key: UPLOAD_DIR
        value: data/uploads
      - key: EXPORT_DIR
        value: data/exports
