<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="ig-base" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#082D2D"/>
      <stop offset="0.38" stop-color="#082D2D"/>
      <stop offset="0.62" stop-color="#0B4941"/>
      <stop offset="1" stop-color="#0E5B4D"/>
    </linearGradient>
    <radialGradient id="ig-light" cx="74%" cy="26%" r="52%">
