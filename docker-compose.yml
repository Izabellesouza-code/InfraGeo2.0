services:
  db:
    image: postgis/postgis:16-3.4
    container_name: infrageo-postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: infrageo
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infrageo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgis_data:
